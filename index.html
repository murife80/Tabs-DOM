
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tabs-container">

        <div class="tab-buttons">
            <button class="tab-button active" data-tab="home">Home</button>
            <button class="tab-button" data-tab="about">About</button>
            <button class="tab-button" data-tab="services">Services</button>
            <button class="tab-button" data-tab="contact">Contact</button>
        </div>

        <div class="tab-content active" id="home">
            <h2>Home</h2>
            <p>Welcome to our website! This is the home tab content.</p>
        </div>

        <div class="tab-content" id="about">
            <h2>About</h2>
            <p>Learn more about us and what we do.</p>
        </div>

        <div class="tab-content" id="services">
            <h2>Services</h2>
            <p>Discover the services we offer to our customers.</p>
        </div>

        <div class="tab-content" id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us for more information.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
